<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f8f4e9">
  <meta name="description" content="倒一倒：把同色果饮倒在一起，慢慢整理桌上的玻璃瓶。">
  <title>倒一倒 · 果饮整理</title>
  <link rel="stylesheet" href="style.css?v=20261118-smooth">
  <link rel="stylesheet" href="pour-motion.css?v=20261119-flow">
  <script defer src="engine.js?v=20261119-flow"></script>
  <script defer src="pour-motion.js?v=20261119-flow"></script>
  <script defer src="app.js?v=20261119-flow"></script>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <div>
          <h1>倒一倒</h1>
          <p>把同色果饮倒在一起</p>
        </div>
      </div>
      <button type="button" class="round-control" id="help" aria-label="查看玩法" aria-haspopup="dialog">
        <span aria-hidden="true">?</span>
      </button>
    </header>

    <div class="mode-picker">
      <div class="mode-switch" role="group" aria-label="选择玩法" aria-describedby="mode-description">
        <button type="button" data-mode="classic" aria-pressed="true">经典整理</button>
        <button type="button" data-mode="mystery" aria-pressed="false">迷雾揭晓</button>
        <button type="button" data-mode="recipe" aria-pressed="false">定向装瓶</button>
      </div>
      <p id="mode-description">所有颜色一开始就能看见。</p>
    </div>

    <section class="workbench" aria-label="果饮整理">
      <div class="stage">
        <div class="level-heading">
          <button type="button" id="level-button" class="level-button" aria-haspopup="dialog" aria-label="选择关卡">
            <span id="level-label">第 1 / 30 关</span>
            <span class="chevron" aria-hidden="true"></span>
          </button>
          <p id="level-name">初见果香</p>
        </div>
        <div class="stage-stats" aria-label="本关进度">
          <span id="progress">0 瓶完成</span>
          <span id="moves">0 步</span>
        </div>
      </div>

      <div class="board-layout">
        <div id="board" class="board" role="group" aria-label="果饮瓶"></div>
      </div>

      <div class="status-line">
        <p id="notice" data-tone="normal" role="status">先点一个有果饮的瓶子。</p>
      </div>
    </section>

    <div class="controls" aria-label="游戏操作">
      <button type="button" class="tool-button" id="undo" disabled>
        <span class="tool-icon" aria-hidden="true">↶</span><span>撤回</span>
      </button>
      <button type="button" class="tool-button" id="hint">
        <span class="tool-icon" aria-hidden="true">✦</span><span>提示</span>
      </button>
      <button type="button" class="tool-button add-button" id="add">
        <span class="tool-icon" aria-hidden="true">＋</span><span>加空瓶</span>
      </button>
      <button type="button" class="tool-button" id="reset">
        <span class="tool-icon" aria-hidden="true">↻</span><span>重开</span>
      </button>
    </div>

    <p class="footnote">随时撤回 · 进度保存在本机</p>
  </main>

  <dialog class="sheet" id="help-dialog" aria-labelledby="help-title">
    <div class="sheet-content">
      <h2 id="help-title">怎么倒？</h2>
      <div class="demo" aria-hidden="true">
        <div class="demo-bottle demo-source"><i></i><i></i></div>
        <div class="demo-drop"></div>
        <div class="demo-bottle demo-target"><i></i><i></i></div>
      </div>
      <ol class="help-steps">
        <li>先点要倒出的瓶子，再点一个顶部同色的瓶子，或一个空瓶。</li>
        <li>把每种颜色装满一瓶就过关。遇到「？」时，倒开上层就能看见下面的颜色。</li>
        <li>定向装瓶时，有标签的瓶子最后要装满指定颜色，中途可以用来周转。</li>
      </ol>
      <button class="primary-button" type="button" id="close-help">开始整理</button>
    </div>
  </dialog>

  <dialog class="sheet" id="levels-dialog" aria-labelledby="levels-title">
    <div class="sheet-content">
      <div class="sheet-heading">
        <h2 id="levels-title">选择关卡</h2>
        <button class="round-control close-button" type="button" id="close-levels" aria-label="关闭选关">×</button>
      </div>
      <div id="level-list" class="level-list"></div>
    </div>
  </dialog>

  <dialog class="sheet" id="win-dialog" aria-labelledby="win-title">
    <div class="sheet-content win-content">
      <span class="win-mark" aria-hidden="true">✓</span>
      <h2 id="win-title">整理好了</h2>
      <p id="win-summary">所有果饮都装好了。</p>
      <button class="primary-button" type="button" id="next">下一关</button>
      <button class="plain-button" type="button" id="close-win">回到棋盘</button>
    </div>
  </dialog>
</body>
</html>
